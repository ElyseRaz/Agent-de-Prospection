name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: leadpilot
          POSTGRES_PASSWORD: leadpilot
          POSTGRES_DB: leadpilot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U leadpilot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://leadpilot:leadpilot@localhost:5432/leadpilot_test?sslmode=disable

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache-dependency-path: backend/go.sum

      - name: Migrations (golang-migrate)
        uses: docker://migrate/migrate:v4.17.1
        with:
          args: >-
            -path=backend/migrations -database ${{ env.DATABASE_URL }} up

      - name: go vet
        working-directory: backend
        run: go vet ./...

      - name: gofmt (verifie que le code est deja formate)
        working-directory: backend
        run: |
          UNFORMATTED=$(gofmt -l .)
          if [ -n "$UNFORMATTED" ]; then
            echo "Fichiers non formates:"; echo "$UNFORMATTED"; exit 1
          fi

      - name: Build
        working-directory: backend
        run: go build ./...

      - name: Tests
        working-directory: backend
        run: go test ./... -cover

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Installer les dependances
        working-directory: frontend
        run: npm install

      - name: Lint (ESLint)
        working-directory: frontend
        run: npm run lint

      - name: Typecheck + build
        working-directory: frontend
        run: npm run build
