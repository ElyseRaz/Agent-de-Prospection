<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 160" width="100%" height="100%">
  <defs>
    <!-- Dégradé principal de l'icône -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    
    <!-- Dégradé secondaire pour l'avion/flèche -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="100%" stop-color="#93C5FD" />
    </linearGradient>

    <!-- Ombre portante subtile -->
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#1D4ED8" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Groupe Icône avec ombre -->
  <g transform="translate(15, 15)" filter="url(#softShadow)">
    <!-- Fond aux coins arrondis harmonieux -->
    <rect width="130" height="130" rx="32" fill="url(#primaryGrad)" />
    
    <!-- Ondes de prospection en arrière-plan (effet radar/signal) -->
    <circle cx="85" cy="45" r="32" fill="none" stroke="#FFFFFF" stroke-width="1.5" opacity="0.15" />
    <circle cx="85" cy="45" r="22" fill="none" stroke="#FFFFFF" stroke-width="1.5" opacity="0.25" />
    
    <!-- Forme stylisée de l'avion de papier / trajectoire de lead -->
    <path d="M35 88 L100 42 L65 107 L53 82 Z" fill="#FFFFFF" opacity="0.95" />
    <path d="M53 82 L77 58 L100 42 Z" fill="url(#accentGrad)" />
    
    <!-- Point d'impact / Signal d'email réussi -->
    <circle cx="85" cy="42" r="6" fill="#F59E0B" />
  </g>

  <!-- Texte du Logo : LeadPilot -->
  <text x="170" y="94" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="50" font-weight="800" fill="#0F172A" letter-spacing="-1.5">
    Lead<tspan fill="#2563EB">Pilot</tspan>
  </text>
  
  <!-- Slogan / Description du CRM -->
  <text x="173" y="124" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600" fill="#64748B" letter-spacing="1">
    CRM &amp; EMAIL CAMPAIGNS
  </text>
</svg>
