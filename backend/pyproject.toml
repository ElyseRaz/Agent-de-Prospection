[project]
name = "remoteradar-backend"
version = "0.1.0"
description = "RemoteRadar - agent IA d'agregation et scoring d'offres freelance remote"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<0.116",
    "uvicorn[standard]>=0.32,<0.33",
    "sqlalchemy[asyncio]>=2.0,<2.1",
    "asyncpg>=0.30,<0.31",
    "psycopg2-binary>=2.9,<3.0",
    "alembic>=1.13,<1.14",
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.5,<3.0",
    "email-validator>=2.2,<3.0",
    "argon2-cffi>=23.1,<24.0",
    "pyjwt>=2.9,<3.0",
    "pyotp>=2.9,<3.0",
    "structlog>=24.4,<25.0",
    "celery[redis]>=5.4,<5.5",
    "redis>=5.1,<6.0",
    "httpx>=0.27,<0.28",
    "anthropic>=1.0,<2.0",
    "langdetect>=1.0,<2.0",
    "selectolax>=0.3,<0.5",
    "pgvector>=0.3,<0.4",
    "sentence-transformers>=3.0,<4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.24,<0.25",
    "pytest-cov>=5.0,<6.0",
    "ruff>=0.6,<0.7",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = [
    "B008", # Depends(...) / Query(...) en valeur par defaut est l'idiome FastAPI standard
]

[tool.ruff.lint.isort]
known-first-party = ["app"]
